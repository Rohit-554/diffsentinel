# DiffSentinel local stack.
# Run from the repository root:
#   docker compose -f infra/docker-compose.yml up -d --build --wait
# Every variable has a local default, so no .env file is needed. To override,
# add --env-file .env. All published ports bind to 127.0.0.1 only.

name: diffsentinel

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diffsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diffsentinel}
      POSTGRES_DB: ${POSTGRES_DB:-diffsentinel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host port defaults to 5433 so it doesn't clash with a locally installed PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending Prisma migrations, then exits; the API starts only after it succeeds.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-diffsentinel}:${POSTGRES_PASSWORD:-diffsentinel}@postgres:5432/${POSTGRES_DB:-diffsentinel}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-diffsentinel}:${POSTGRES_PASSWORD:-diffsentinel}@postgres:5432/${POSTGRES_DB:-diffsentinel}
      REDIS_URL: redis://redis:6379
      API_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      # GitHub sign-in: all empty leaves it disabled; see .env.example.
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  reviewer:
    build:
      context: ..
      dockerfile: services/reviewer/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      REVIEWER_PORT: "8000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
