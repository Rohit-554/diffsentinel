name: CI

on:
  push:
  pull_request:

# Read-only token; no repository secrets are used, so fork pull requests run every gate.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: TypeScript (lint, typecheck, test, integration, build)
    runs-on: ubuntu-latest
    # Throwaway databases for the API integration tests; the credentials are CI-only.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: diffsentinel
          POSTGRES_PASSWORD: diffsentinel
          POSTGRES_DB: diffsentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diffsentinel" --health-interval 5s --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://diffsentinel:diffsentinel@localhost:5432/diffsentinel
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @diffsentinel/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @diffsentinel/api test:integration
      - run: pnpm build

  python:
    name: Reviewer (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/reviewer
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # this action publishes no moving major tag
        with:
          version: "0.8.3"
          working-directory: services/reviewer
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack and wait for healthy services
        run: docker compose -f infra/docker-compose.yml up -d --build --wait --wait-timeout 240
      - name: Check readiness endpoints
        run: |
          curl -fsS http://127.0.0.1:3000/api/v1/health/ready
          curl -fsS http://127.0.0.1:8000/health/ready
          curl -fsS http://127.0.0.1:8080/api/v1/health/ready
      - name: Show container logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
